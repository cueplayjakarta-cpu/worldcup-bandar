name: Debug raw odds (sekali pakai)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tarik 1 respons mentah
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: node debug-raw.js
      - uses: actions/upload-artifact@v4
        with:
          name: debug-raw
          path: debug-raw.json
