name: Refresh odds

# Auto-tarik odds & perbarui situs. API key disimpan sebagai SECRET (tidak pernah publik).
on:
  schedule:
    - cron: '*/5 * * * *'    # tiap ~5 menit (mengikuti laga; GitHub kadang menunda sedikit)
  workflow_dispatch:           # tombol "Run workflow" manual

permissions:
  contents: write

concurrency:
  group: refresh-odds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tarik odds (atau fallback demo)
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: node fetch-odds.js || node fetch-odds.js --demo

      - name: Commit data baru bila berubah
        run: |
          git config user.name "lensa-bandar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.js data/matches.json data/history.json data/archive.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "auto: refresh odds $(date -u +%FT%TZ) [skip ci]"
            git push
          fi
