name: Refresh odds (cadangan)

# Sumber UTAMA situs = Cloudflare Worker (cron */2, andal & tepat waktu).
# Action ini cuma menjaga file STATIS (data/matches.js) tetap cukup segar sebagai
# CADANGAN bila Worker down. Sengaja ringan (1x tarik per jam) agar tidak menghabiskan
# kuota free tier odds-api.io yang juga dipakai Worker.
on:
  schedule:
    - cron: '17 * * * *'      # tiap jam (menit :17)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-odds
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tarik odds & simpan bila REAL (jangan pernah commit demo)
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: |
          git config user.name "lensa-bandar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node fetch-odds.js || true
          if node -e 'const d=JSON.parse(require("fs").readFileSync("data/matches.js","utf8").replace(/^window\.__BANDAR_DATA__\s*=\s*/,"").replace(/;\s*$/,"")); process.exit(d.isDemo?1:0)'; then
            git add data/matches.js data/matches.json data/history.json data/archive.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -q -m "auto: refresh odds (cadangan) $(date -u +%FT%TZ) [skip ci]" || true
              git pull --rebase -q origin main || true
              git push -q || true
            fi
          else
            echo "API kosong → pertahankan data REAL terakhir, skip commit"
          fi
